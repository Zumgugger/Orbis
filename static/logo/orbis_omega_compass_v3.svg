<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Orbis Logo v3 - Omega + Geometric Compass (BW)</title>
  <desc>Bold geometric Omega with eight-point compass lines.</desc>
  <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bold Omega top arc -->
    <path d="M90 320 A166 166 0 0 1 422 320" stroke-width="28"/>
    <!-- Bold Omega pillars -->
    <line x1="90" y1="320" x2="90" y2="430" stroke-width="28"/>
    <line x1="422" y1="320" x2="422" y2="430" stroke-width="28"/>
    <!-- Bold Omega base (shorter to emphasize heft) -->
    <line x1="140" y1="430" x2="372" y2="430" stroke-width="28"/>

    <!-- Geometric compass frame -->
    <circle cx="256" cy="290" r="62" stroke-width="12"/>

    <!-- Eight-point compass lines -->
    <line x1="256" y1="228" x2="256" y2="352" stroke-width="10"/>
    <line x1="194" y1="290" x2="318" y2="290" stroke-width="10"/>
    <line x1="220" y1="254" x2="292" y2="326" stroke-width="10"/>
    <line x1="220" y1="326" x2="292" y2="254" stroke-width="10"/>

    <!-- Center hub -->
    <circle cx="256" cy="290" r="8" fill="white" stroke="black" stroke-width="8"/>
  </g>
</svg>
