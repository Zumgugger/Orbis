<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Orbis Logo v1 - Omega + Compass (BW)</title>
  <desc>Classic Omega with compass rose centered, black and white.</desc>
  <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    <!-- Omega top arc -->
    <path d="M96 320 A160 160 0 0 1 416 320" stroke-width="24"/>
    <!-- Omega pillars -->
    <line x1="96" y1="320" x2="96" y2="420" stroke-width="24"/>
    <line x1="416" y1="320" x2="416" y2="420" stroke-width="24"/>
    <!-- Omega base bar (slightly inset) -->
    <line x1="128" y1="420" x2="384" y2="420" stroke-width="24"/>

    <!-- Compass outer circle -->
    <circle cx="256" cy="290" r="60" stroke-width="10"/>

    <!-- Compass rose (cardinal) -->
    <polygon points="256,230 296,290 256,350 216,290" fill="black" stroke="none"/>
    <!-- Intercardinal (rotated diamond) -->
    <g transform="rotate(45 256 290)">
      <polygon points="256,245 286,290 256,335 226,290" fill="black" stroke="none"/>
    </g>

    <!-- Compass center -->
    <circle cx="256" cy="290" r="8" fill="white" stroke="black" stroke-width="6"/>
  </g>
</svg>
