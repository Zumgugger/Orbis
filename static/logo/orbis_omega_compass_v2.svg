<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Orbis Logo v2 - Omega + Compass Needle (BW)</title>
  <desc>Minimalist Omega with a simple compass needle inside.</desc>
  <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    <!-- Thin Omega top arc -->
    <path d="M110 320 A146 146 0 0 1 402 320" stroke-width="16"/>
    <!-- Thin Omega pillars -->
    <line x1="110" y1="320" x2="110" y2="420" stroke-width="16"/>
    <line x1="402" y1="320" x2="402" y2="420" stroke-width="16"/>
    <!-- Thin Omega base bar -->
    <line x1="140" y1="420" x2="372" y2="420" stroke-width="16"/>

    <!-- Compass boundary -->
    <circle cx="256" cy="290" r="58" stroke-width="8"/>

    <!-- Compass needle (north pointing) -->
    <polygon points="256,240 270,300 242,300" fill="black" stroke="none"/>
    <!-- South counterweight -->
    <polygon points="256,340 266,310 246,310" fill="black" stroke="none"/>

    <!-- Center pivot -->
    <circle cx="256" cy="300" r="6" fill="white" stroke="black" stroke-width="6"/>
  </g>
</svg>
