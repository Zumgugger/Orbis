{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle" style="font-size: 6rem; color: #ffc107;"></i>
            </div>
            <h1 class="display-1 fw-bold text-warning">500</h1>
            <h2 class="mb-3">Server Error</h2>
            <p class="lead text-muted mb-4">
                Something went wrong on our end. We're working to fix it.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Go Home
                </a>
                <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Retry
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
