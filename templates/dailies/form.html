{% extends "base.html" %}

{% block title %}{{ action }} Daily - Orbis{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2>{{ action }} Daily</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title *</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ daily.title if daily else '' }}" required
                               placeholder="e.g., Morning Exercise, Read 30 minutes">
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                                  placeholder="Optional details about this daily task">{{ daily.description if daily else '' }}</textarea>
                    </div>
                    
                    {% if daily %}
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 
                        <strong>Current Stats:</strong> 
                        {{ daily.streak_count }} day streak, 
                        {{ daily.total_completions }} total completions
                    </div>
                    {% endif %}
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dailies.list_dailies') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> {{ action }} Daily
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
