{% extends "base.html" %}

{% block title %}{{ action }} Todo - Orbis{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2>{{ action }} Todo</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title *</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ todo.title if todo else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ todo.description if todo else '' }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="priority" class="form-label">Importance</label>
                            <select class="form-select" id="priority" name="priority">
                                <option value="low" {% if todo and todo.priority == 'low' %}selected{% endif %}>Low</option>
                                <option value="medium" {% if todo and todo.priority == 'medium' %}selected{% elif not todo %}selected{% endif %}>Medium</option>
                                <option value="high" {% if todo and todo.priority == 'high' %}selected{% endif %}>High</option>
                            </select>
                        </div>
                        
                        {% if show_due_date %}
                        <div class="col-md-6 mb-3">
                            <label for="due_date" class="form-label">Due Date</label>
                            <div class="input-group">
                                <input type="date" class="form-control" id="due_date" name="due_date" 
                                       value="{{ todo.due_date if todo and todo.due_date else preset_due_date }}">
                                <button class="btn btn-outline-secondary" id="btnDueToday" type="button" title="Set to today">
                                    <i class="bi bi-calendar-check"></i>
                                </button>
                                <button class="btn btn-outline-secondary" id="btnDueTomorrow" type="button" title="Set to tomorrow">
                                    <i class="bi bi-sunrise"></i>
                                </button>
                            </div>
                        </div>
                        {% else %}
                        <input type="hidden" id="due_date" name="due_date" value="{{ preset_due_date }}">
                        {% endif %}
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('todos.list_todos') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> {{ action }} Todo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% if show_due_date %}
<script>
(function() {
    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }
    const dueInput = document.getElementById('due_date');
    const btnToday = document.getElementById('btnDueToday');
    const btnTomorrow = document.getElementById('btnDueTomorrow');
    if (btnToday && dueInput) {
        btnToday.addEventListener('click', function(e) {
            e.preventDefault();
            const today = new Date();
            dueInput.value = formatDate(today);
            dueInput.dispatchEvent(new Event('change'));
        });
    }
    if (btnTomorrow && dueInput) {
        btnTomorrow.addEventListener('click', function(e) {
            e.preventDefault();
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            dueInput.value = formatDate(tomorrow);
            dueInput.dispatchEvent(new Event('change'));
        });
    }
})();
</script>
{% endif %}
{% endblock %}
