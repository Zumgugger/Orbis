# Apache2 Virtual Host Configuration for Orbis
# Copy to: /etc/apache2/sites-available/orbis.zumgugger.ch.conf
# Enable with: sudo a2ensite orbis.zumgugger.ch

<VirtualHost *:80>
    ServerName orbis.zumgugger.ch

    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName orbis.zumgugger.ch

    # SSL Configuration (managed by Certbot)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/orbis.zumgugger.ch/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/orbis.zumgugger.ch/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"

    # Proxy to Docker container
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    # Timeout settings for longer requests
    ProxyTimeout 120

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/orbis_error.log
    CustomLog ${APACHE_LOG_DIR}/orbis_access.log combined
</VirtualHost>
