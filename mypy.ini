[mypy]
python_version = 3.8
warn_unused_configs = True
ignore_missing_imports = True
strict_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = True

[mypy-tests.*]
ignore_errors = True

[mypy-database]
ignore_errors = True

[mypy-app]
ignore_errors = True

[mypy-blueprints.*]
ignore_errors = True

[mypy-utilities]
ignore_errors = True
